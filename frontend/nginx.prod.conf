server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend over the internal docker network — the
    # backend container itself is never exposed to the internet directly.
    location /api {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA: any other path falls back to index.html so client-side routing
    # (react-router) handles it.
    location / {
        try_files $uri /index.html;
    }
}
